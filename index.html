<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendégregisztráció</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2541;
    --ink-soft:#3C4A6B;
    --paper:#F1EEE3;
    --paper-line:#dcd6c4;
    --card:#FBFAF5;
    --seal:#A13D2B;
    --seal-soft:#c65a44;
    --brass:#B58B46;
    --ok:#3f6b4a;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }

  body{
    background-image:
      repeating-linear-gradient(0deg, rgba(28,37,65,0.035) 0px, rgba(28,37,65,0.035) 1px, transparent 1px, transparent 32px);
    padding:48px 20px 90px;
  }

  .sheet{
    max-width:720px;
    margin:0 auto;
    position:relative;
  }

  header.letterhead{
    text-align:center;
    padding-bottom:22px;
    margin-bottom:30px;
    border-bottom:2px solid var(--ink);
    position:relative;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 10px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 5vw, 42px);
    margin:0 0 8px;
    letter-spacing:0.01em;
  }

  .sub{
    font-size:14px;
    color:var(--ink-soft);
    margin:0;
  }

  .stamp{
    position:absolute;
    top:-6px;
    right:6px;
    width:86px;
    height:86px;
    border:2.5px solid var(--seal);
    border-radius:50%;
    color:var(--seal);
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(-14deg);
    opacity:0.55;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.06em;
    text-align:center;
    line-height:1.35;
    pointer-events:none;
  }
  .stamp::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid var(--seal);
    border-radius:50%;
  }

  #guestList{
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .guest-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:2px;
    box-shadow:0 1px 0 rgba(28,37,65,0.04), 0 10px 24px -18px rgba(28,37,65,0.5);
    position:relative;
    padding:22px 22px 20px;
    animation:riseIn 0.35s ease both;
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  .guest-card::before{
    content:"";
    position:absolute;
    top:0; left:24px; right:24px;
    height:0;
    border-top:2px dashed var(--paper-line);
  }

  .guest-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    padding-top:6px;
  }

  .guest-tag{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .guest-num{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:600;
    color:var(--card);
    background:var(--ink);
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .guest-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
  }

  .remove-btn{
    background:none;
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:6px 11px;
    border-radius:20px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .remove-btn:hover{
    border-color:var(--seal);
    color:var(--seal);
  }

  .field-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
  }

  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  @media (max-width:480px){
    .field-row{ grid-template-columns:1fr; }
  }

  .field label{
    display:block;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .field input{
    width:100%;
    padding:11px 12px;
    font-size:15px;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:3px;
    outline:none;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input.mono{
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.03em;
  }

  .field input:focus{
    border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(28,37,65,0.08);
  }

  .field input.error{
    border-color:var(--seal);
    box-shadow:0 0 0 3px rgba(161,61,43,0.1);
  }

  .add-row{
    display:flex;
    justify-content:center;
    margin-top:24px;
  }

  .add-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:1.5px dashed var(--ink-soft);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:12px 22px;
    border-radius:26px;
    cursor:pointer;
    transition:all 0.18s ease;
  }
  .add-btn:hover{
    border-style:solid;
    border-color:var(--brass);
    background:rgba(181,139,70,0.08);
  }
  .add-btn svg{ width:14px; height:14px; }

  .submit-row{
    margin-top:38px;
    border-top:2px solid var(--ink);
    padding-top:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }

  .submit-btn{
    background:var(--ink);
    color:#fff;
    border:none;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    letter-spacing:0.03em;
    padding:15px 42px;
    border-radius:3px;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.15s ease;
  }
  .submit-btn:hover{ background:#152039; }
  .submit-btn:active{ transform:scale(0.98); }
  .submit-btn:disabled{ opacity:0.55; cursor:not-allowed; }

  .status{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.03em;
    min-height:18px;
    text-align:center;
  }
  .status.ok{ color:var(--ok); }
  .status.err{ color:var(--seal); }

  .seal-pop{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:2px solid var(--ok);
    color:var(--ok);
    padding:6px 16px;
    border-radius:22px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    transform:rotate(-3deg);
    animation:stampIn 0.35s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes stampIn{
    from{ opacity:0; transform:rotate(-3deg) scale(1.6); }
    to{ opacity:1; transform:rotate(-3deg) scale(1); }
  }

  footer.note{
    text-align:center;
    margin-top:30px;
    font-size:11.5px;
    color:var(--ink-soft);
  }

  @media (max-width:480px){
    .sheet{ padding:0 2px; }
    .stamp{ width:68px; height:68px; font-size:8px; top:-4px; right:0; }
  }
</style>
</head>
<body>

<div class="sheet">

  <header class="letterhead">
    <p class="eyebrow">Balancaa Beach · Szálláshely · Bejelentőlap</p>
    <h1>Vendégregisztráció</h1>
    <p class="sub">Kérem töltse ki minden érkező vendég adatait, majd nyomjon rá a küldés gombra.</p>
    <div class="stamp">HIVATALOS<br>NYILVÁN-<br>TARTÁS</div>
  </header>

  <div id="guestList"></div>

  <div class="add-row">
    <button type="button" class="add-btn" id="addGuestBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Vendég hozzáadása
    </button>
  </div>

  <div class="submit-row">
    <button type="button" class="submit-btn" id="submitBtn">Adatok küldése</button>
    <div class="status" id="statusEl"></div>
  </div>

  <footer class="note">Balancaa Beach</footer>

</div>

<script>
  // ===== CONFIG =====
  const SHEETDB_URL = "https://sheetdb.io/api/v1/83m1jtfvyydd2";

  const guestList = document.getElementById('guestList');
  const addGuestBtn = document.getElementById('addGuestBtn');
  const MAX_GUESTS = 5;
  let guestCount = 0;

  function updateAddButtonState(){
    const atMax = guestList.children.length >= MAX_GUESTS;
    addGuestBtn.disabled = atMax;
    addGuestBtn.style.opacity = atMax ? 0.4 : 1;
    addGuestBtn.style.cursor = atMax ? 'not-allowed' : 'pointer';
  }

  function createGuestCard(){
    if(guestList.children.length >= MAX_GUESTS){
      updateAddButtonState();
      setStatus(`Egyszerre legfeljebb ${MAX_GUESTS} vendég adható hozzá.`, 'err');
      return;
    }
    guestCount++;
    const idx = guestCount;

    const card = document.createElement('div');
    card.className = 'guest-card';
    card.dataset.id = idx;

    card.innerHTML = `
      <div class="guest-head">
        <div class="guest-tag">
          <span class="guest-num">${idx}</span>
          <span class="guest-title">Vendég</span>
        </div>
        <button type="button" class="remove-btn" data-action="remove">Eltávolítás</button>
      </div>
      <div class="field-grid">
        <div class="field">
          <label>Név</label>
          <input type="text" data-field="nev" placeholder="Vezetéknév Keresztnév">
        </div>
        <div class="field">
          <label>Anyja neve</label>
          <input type="text" data-field="anyjaNeve" placeholder="Vezetéknév Keresztnév">
        </div>
        <div class="field-row">
          <div class="field">
            <label>Születési hely</label>
            <input type="text" data-field="szuletesiHely" placeholder="Város">
          </div>
          <div class="field">
            <label>Születési dátum</label>
            <input type="date" data-field="szuletesiDatum">
          </div>
        </div>
        <div class="field">
          <label>Állampolgárság</label>
          <input type="text" data-field="allampolgarsag" value="magyar">
        </div>
        <div class="field">
          <label>Lakcím</label>
          <input type="text" data-field="lakcim" placeholder="pl: 1052 Budapest, Fő utca 1.">
        </div>
        <div class="field">
          <label>Személyi igazolvány szám</label>
          <input type="text" class="mono" data-field="szemelyiIgazolvany" placeholder="pl. 123456AB">
        </div>
      </div>
    `;

    card.querySelector('[data-action="remove"]').addEventListener('click', () => {
      if(guestList.children.length <= 1){
        setStatus('Legalább egy vendégnek szerepelnie kell.', 'err');
        return;
      }
      card.remove();
      renumberGuests();
      updateAddButtonState();
    });

    guestList.appendChild(card);
    updateAddButtonState();
  }

  function renumberGuests(){
    [...guestList.children].forEach((card, i) => {
      card.querySelector('.guest-num').textContent = i + 1;
    });
  }

  function setStatus(text, type){
    const el = document.getElementById('statusEl');
    el.textContent = '';
    el.className = 'status' + (type ? ' ' + type : '');
    if(type === 'ok'){
      const seal = document.createElement('span');
      seal.className = 'seal-pop';
      seal.textContent = text;
      el.appendChild(seal);
    } else {
      el.textContent = text;
    }
  }

  document.getElementById('addGuestBtn').addEventListener('click', createGuestCard);

  createGuestCard();
  createGuestCard();

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const cards = [...guestList.children];
    const guests = [];
    let hasError = false;

    cards.forEach(card => {
      card.querySelectorAll('input').forEach(i => i.classList.remove('error'));
      const nev = card.querySelector('[data-field="nev"]');
      const anyjaNeve = card.querySelector('[data-field="anyjaNeve"]');
      const szuletesiHely = card.querySelector('[data-field="szuletesiHely"]');
      const szuletesiDatum = card.querySelector('[data-field="szuletesiDatum"]');
      const allampolgarsag = card.querySelector('[data-field="allampolgarsag"]');
      const lakcim = card.querySelector('[data-field="lakcim"]');
      const szemelyiIgazolvany = card.querySelector('[data-field="szemelyiIgazolvany"]');

      [nev, anyjaNeve, szuletesiHely, szuletesiDatum, allampolgarsag, lakcim, szemelyiIgazolvany].forEach(input => {
        if(!input.value.trim()){
          input.classList.add('error');
          hasError = true;
        }
      });

      guests.push({
        nev: nev.value.trim(),
        anyjaNeve: anyjaNeve.value.trim(),
        szuletesiHely: szuletesiHely.value.trim(),
        szuletesiDatum: szuletesiDatum.value.trim(),
        allampolgarsag: allampolgarsag.value.trim(),
        lakcim: lakcim.value.trim(),
        szemelyiIgazolvany: szemelyiIgazolvany.value.trim()
      });
    });

    if(hasError){
      setStatus('Kérjük, töltse ki az összes mezőt minden vendégnél.', 'err');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    setStatus('Küldés folyamatban…');

    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const beküldésIdeje = `${now.getFullYear()}. ${pad(now.getMonth()+1)}. ${pad(now.getDate())}. ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    const rows = guests.map((g, i) => ({
      'Beküldés ideje': beküldésIdeje,
      'sorszám': i + 1,
      'név': g.nev,
      'anyja neve': g.anyjaNeve,
      'születési hely': g.szuletesiHely,
      'születési dátum': g.szuletesiDatum,
      'Állampolgárság': g.allampolgarsag,
      'Lakcím': g.lakcim,
      'Személyi igazolvány szám': g.szemelyiIgazolvany
    }));

    try {
      const response = await fetch(SHEETDB_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: rows })
      });

      if (response.ok) {
        setStatus('Sikeresen elküldve ✓', 'ok');
      } else {
        const errText = await response.text();
        console.error('SheetDB hiba:', errText);
        setStatus('Hiba történt a küldés közben. Próbálja újra.', 'err');
      }
    } catch (err){
      console.error(err);
      setStatus('Hiba történt a küldés közben. Próbálja újra.', 'err');
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
